# 前端统一 nginx 配置：静态资源 + /api 反代到后端
# 关键点：
#  1) 三个前端都用 createWebHistory（history 路由），必须 try_files 回落到 index.html
#  2) /api/ 反代保留原路径（proxy_pass 末尾不带 /），后端 Base 即 /api/v1
#  3) 长连接（打印任务 SSE / 轮询）关闭 proxy buffering，避免事件被攒着不吐
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
