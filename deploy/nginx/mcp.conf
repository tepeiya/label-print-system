# MCP 入口（apps/mcp-server）的反代片段
# 用途：把 https://<域名>/mcp 转到 mcp:3300/mcp，由 nginx 终结 TLS。
# 放置：/etc/nginx/conf.d/labelflow-mcp.conf，证书可与 console 共用。
#
# 要点：
#  1) proxy_buffering off —— Streamable HTTP 的 SSE 流（GET /mcp）必须边收边发，
#     缓冲住会表现为「initialize 成功、之后一直没消息」。
#  2) Authorization 头必须原样透传（这是每会话绑定租户的唯一凭据）。
#  3) 不做 proxy_cache；POST 响应也不能缓存。
#  4) 读超时给足，SSE 长连接默认 60s 会被掐。

upstream labelflow_mcp {
    server mcp:3300;            # compose 网络内的服务名；裸机部署改成 127.0.0.1:3300
    keepalive 16;
}

server {
    # HTTP/2 写法按 nginx 版本二选一：
    #   nginx < 1.25（Ubuntu 22.04 自带 1.18 属这类）：  listen 443 ssl http2;
    #   nginx >= 1.25：                                 listen 443 ssl;  加下面一行  http2 on;
    # 这里默认用旧写法（兼容面更广），新版只会给 deprecation warning，不会报错。
    listen 443 ssl http2;
    server_name mcp.example.com;          # 换成你的域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;
    client_max_body_size 2m;              # 服务端自身上限 1MB（MAX_BODY_BYTES），这里留余量

    location = /mcp {
        proxy_pass         http://labelflow_mcp/mcp;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;   # 不能丢
        proxy_set_header   Connection        "";

        proxy_buffering    off;             # SSE 必须关
        proxy_cache        off;
        add_header         X-Accel-Buffering no;
    }

    # 探活单独放出去，便于监控/负载均衡健康检查（不带 token）
    location = /mcp-health {
        proxy_pass http://labelflow_mcp/health;
        access_log off;
    }

    location / {
        return 404;
    }
}
