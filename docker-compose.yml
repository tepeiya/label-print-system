# LabelFlow 一键启动（演示 / 自托管）
# 用法：
#   docker compose up -d --build          # 首次：建库 → 起 API/Worker → 起三个前端
#   docker compose down -v                # 清空数据（含数据库卷）
#   docker compose logs -f api            # 看后端日志
#
# 端口约定（与 docs/10-dev-handover.md §10.1.2 一致）：
#   后端 API 3200 / PostgreSQL 5433 / Redis 6380
#   console 租户后台 5173 / platform 平台后台 5181 / pda 手持 5185
#   MCP 入口（Streamable HTTP）3300 —— 只给外部 Agent 用，浏览器/前端没必要暴露
#   老前端 web 5180 仅在 profiles=legacy 时启动（已弃用，只作行为对照）
#   端口 3000 属其他项目，禁止占用。
#
# 生产上线必改：把 NODE_ENV 改成 production，并设置强 JWT_SECRET 与非弱口令 DB 密码，
# 否则后端会按 config.guard 拒绝启动（这是有意的 fail-fast）。

x-api-build: &api-build
  context: ./backend
  dockerfile: Dockerfile

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"                 # 容器网络内 postgres:5432（宿主映射 5433 不影响容器互联）
  DB_NAME: labelflow
  DB_USER: labelflow
  DB_PASS: ${DB_PASS:-labelflow}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: labelflow
      POSTGRES_PASSWORD: ${DB_PASS:-labelflow}
      POSTGRES_DB: labelflow
    ports: ["5433:5432"]        # 宿主 5433 -> 容器 5432
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelflow -d labelflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]        # 宿主 6380 -> 容器 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 一次性建库任务：按 backend/scripts/db-manifest.txt 的固定顺序执行全部 SQL（全部幂等），
  # 结束后自检 87 张表是否齐全（实际 91 张 = 87 业务表 + 4 框架表）。api / worker 必须等它成功退出再启动。
  db-init:
    image: postgres:16-bookworm
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./backend/scripts:/sql:ro
      - ./docs/03-database.sql:/base/03-database.sql:ro
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: labelflow
      PGPASSWORD: ${DB_PASS:-labelflow}
      PGDATABASE: labelflow
      SQL_DIR: /sql
      BASE_DDL: /base/03-database.sql
    command: ["bash", "/sql/db-init.sh", "--seed-demo"]
    restart: "no"

  api:
    build: *api-build
    image: labelflow/api:dev
    environment:
      <<: *db-env
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      PORT: "3200"
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["3200:3200"]
    healthcheck:
      # 非 HTTP 探活：3200 端口能建立 TCP 连接即视为进程已起来
      test: ["CMD", "node", "-e", "const n=require('net');const s=n.connect(3200,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s       # Nest 首次冷启动约 45–70s（模块加载重），给足余量
    restart: unless-stopped

  worker:
    build: *api-build
    image: labelflow/api:dev
    command: ["node", "dist/worker.js"]
    environment:
      <<: *db-env
      REDIS_URL: redis://redis:6379
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # MCP 入口（apps/mcp-server）：给外部 Agent（Claude Desktop / Code / 客户自有 Agent）接的通道。
  # - 只依赖 api：不接 postgres/redis，进程无数据库凭据；一 token 一会话一租户，token 由租户后台签发。
  # - 不在容器里做 TLS：生产前面挂一层反代，把 https://<域名>/mcp → mcp:3300/mcp（示例见 apps/mcp-server/README.md）。
  # - stdio 传输不进容器：本地 Claude Desktop 用 `node apps/mcp-server/dist/index.js` 直接拉起。
  mcp:
    build:
      context: ./apps/mcp-server
      dockerfile: Dockerfile
    image: labelflow/mcp:dev
    environment:
      AGENT_API_BASE: http://api:3200/api/v1
      PORT: "3300"
      HOST: 0.0.0.0
      SESSION_IDLE_MS: ${MCP_SESSION_IDLE_MS:-1800000}
      MAX_BODY_BYTES: ${MCP_MAX_BODY_BYTES:-1048576}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      api: { condition: service_healthy }
    ports: ["3300:3300"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # 租户后台（Vue 3，nginx 反代 /api → api:3200）
  console:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args: { APP: console }
    image: labelflow/console:dev
    depends_on:
      api: { condition: service_healthy }
    ports: ["5173:80"]
    restart: unless-stopped

  # 平台后台（SaaS 运营）
  platform:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args: { APP: platform }
    image: labelflow/platform:dev
    depends_on:
      api: { condition: service_healthy }
    ports: ["5181:80"]
    restart: unless-stopped

  # 手持 PDA（手机同网段访问 http://<宿主IP>:5185）
  pda:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args: { APP: pda }
    image: labelflow/pda:dev
    depends_on:
      api: { condition: service_healthy }
    ports: ["5185:80"]
    restart: unless-stopped

  # ⚠️ DEPRECATED：老版原生 HTML5 前端，仅作行为对照，默认不启动。
  #    启用：docker compose --profile legacy up -d web
  web:
    image: nginx:alpine
    profiles: ["legacy"]
    volumes: ["./web:/usr/share/nginx/html:ro"]
    ports: ["5180:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
