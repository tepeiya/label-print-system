# LabelFlow 一键启动（开发/演示）
# 用法：docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: labelflow
      POSTGRES_PASSWORD: labelflow
      POSTGRES_DB: labelflow
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelflow"]
      interval: 5s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  api:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: labelflow
      DB_USER: labelflow
      DB_PASS: labelflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-prod
    depends_on: [postgres, redis]
    ports: ["3000:3000"]

  worker:
    build: ./backend
    command: npm run worker
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_HOST=postgres
    depends_on: [postgres, redis]

  # ⚠️ DEPRECATED（已弃用）：web 是老版原生 HTML5 前端，仅作行为对照，不再新增功能。
  #    新前端为 Vue 3：apps/console（租户后台 :5173）、apps/platform（平台后台 :5181）；
  #    待新前端功能完善后，本服务与 ./web 一并删除。
  web:
    image: nginx:alpine
    volumes: ["./web:/usr/share/nginx/html:ro"]
    ports: ["5180:80"]
    depends_on: [api]
    environment:
      - API_BASE=http://api:3000/api/v1

volumes:
  pgdata:
